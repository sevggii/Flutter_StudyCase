version: 0.1.0

environment:
  sdk: '>=3.0.6 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  riverpod: ^2.4.4
  http: ^1.1.0
  shared_preferences: ^2.2.2
  get: ^4.1.4

